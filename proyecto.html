<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbee - Tablero</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <div class="header">
            <h1>Tablero Urbee</h1>
            <div class="header-buttons">
                <button class="add-board-btn" onclick="showAddBoardModal()">+ Nuevo Proyecto</button>
                <button class="logout-btn" onclick="window.location.href='login.html'">Cerrar Sesión</button>
            </div>
        </div>

        <div class="boards-container" id="boardsContainer">
            <!-- Los tableros se cargarán dinámicamente aquí -->
        </div>
    </div>

    <!-- MODAL PARA AGREGAR TABLERO -->
    <div id="addBoardModal" class="input-modal" style="display: none;">
        <div class="input-modal-content">
            <h2> Nuevo Proyecto</h2>
            <div class="input-group">
                <label>Nombre del proyecto</label>
                <input type="text" id="boardTitleInput" placeholder="Ej: Desarrollo App Móvil">
            </div>
            <div style="font-size: 14px; color: #6b778c; margin-top: 10px;">
                Se crearán automáticamente las listas: Pendientes, En proceso, Completados.
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="hideAddBoardModal()">Cancelar</button>
                <button class="btn-primary" onclick="createBoard()">Crear Proyecto</button>
            </div>
        </div>
    </div>

    <!-- MODAL PARA EDITAR TARJETA -->
    <div id="editCardModal" class="input-modal" style="display: none;">
        <div class="input-modal-content">
            <h2> Editar Tarea</h2>
            <div class="input-group">
                <label>Título</label>
                <input type="text" id="cardTitleInput">
            </div>
            <div class="input-group">
                <label>Descripción</label>
                <textarea id="cardDescInput" rows="4" placeholder="Describe la tarea en detalle..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="hideEditCardModal()">Cancelar</button>
                <button class="btn-primary" onclick="saveCard()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
