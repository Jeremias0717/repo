<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbee - Sign In</title>
    <!-- Vincula este archivo HTML con la hoja de estilos externa -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Contenedor general que agrupa la tarjeta de login completa -->
    <div class="login-container">
        
        <!-- SECCIÓN IZQUIERDA: Contiene todo el formulario y textos -->
        <div class="form-section">
            
            <!-- Logo principal de la marca -->
            <div class="logo">urbee</div>
            
            <!-- Título de bienvenida principal -->
            <h1 class="main-title">Welcome Back</h1>
            
            <!-- Subtítulo descriptivo debajo del título -->
            <p class="subtitle">Sign in with your email address and Password.</p>
            
            <!-- Formulario de inicio de sesión (Apunta a proyecto.html al dar submit) -->
            <form class="login-form" action="proyecto.html">
                
                <!-- Etiqueta del campo de correo electrónico -->
                <label>Email Address</label>
                
                <!-- Contenedor relativo especial para añadir el check verde sobre el input -->
                <div class="input-wrapper verified">
                    <input type="email" value="johndoe123@xyz.com" required>
                </div>
                
                <!-- Etiqueta del campo de contraseña -->
                <label>Password</label>
                <!-- Campo de contraseña (esconde los caracteres con puntos) -->
                <input type="password" value="••••••••••••" required>
                
                <!-- Bloque de opciones inferiores (Recordarme y Olvidé mi contraseña) -->
                <div class="form-options">
                    <!-- Checkbox de "Remember me" envuelto en un label para que sea clicable en el texto -->
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        <span>Remember me</span>
                    </label>
                    <!-- Enlace para recuperar la contraseña -->
                    <a href="#">Forgot Password?</a>
                </div>
                
                <!-- Botón para procesar y enviar el formulario -->
                <button type="submit" class="btn-login">Sign In</button>
            </form>
            
            <!-- Bloque inferior por si el usuario no tiene una cuenta creada -->
            <div class="signup-redirect">
                Don't have an account? <a href="#">Sign Up</a>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: Espacio reservado para la imagen de fondo -->
        <div class="image-section"></div>
    </div>

</body>
</html>
