<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbee - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="form-section">
            <div class="logo">urbee</div>
            <h1 class="main-title">Bienvenido de nuevo</h1>
            <p class="subtitle">Inicia sesión con tu dirección de correo electrónico y contraseña.</p>
            
            <form class="login-form" action="proyecto.html" id="loginForm">
                <label>Correo Electrónico</label>
                <!-- Wrapper con clase 'verified' para mostrar icono de verificación verde -->
                <div class="input-wrapper verified">
                    <input type="email" id="emailInput" value="johndoe123@xyz.com" required>
                </div>
                
                <label>Contraseña</label>
                <input type="password" id="passwordInput" value="••••••••••••" required>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        <span>Recordarme</span>
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            
            <div class="signup-redirect">
                ¿No tienes una cuenta? <a href="register.html">Regístrate</a>
            </div>
        </div>

        <div class="image-section"></div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
